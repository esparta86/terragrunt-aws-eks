apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default-spot
  labels:
      app.kubernetes.io/component: aws-nodepool
      app.kubernetes.io/instance: default-spot
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: default-spot
      app.kubernetes.io/part-of: karpenter
      app.kubernetes.io/version: 0.1.0
      helm.sh/chart: karpenter-ec2-node-class-0.1.0
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h # 30 * 24h = 720h
